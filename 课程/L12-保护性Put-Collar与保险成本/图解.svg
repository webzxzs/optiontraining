<title id="title">L12：持股、Protective Put、K95 Collar、零净费K90 Collar到期经济损益曲线</title>
<desc id="desc">统一模拟ABC股票现价100美元，持100股、六个月同到期美式期权每张100股。买K95 Put Ask4.20，买K90 Put Ask2.00，卖K115 Call Bid2.00。持股最大理论亏损10000美元，K95 Protective Put最坏亏920美元且上涨不封顶，K95/K115 Collar最坏亏720美元最高赚1280美元，零净权利金K90/K115 Collar最坏亏1000美元最高赚1500美元。图仅显示股价0至180美元的到期净经济收益，不含费用分红税和真实账户提前指派及成交风险。</desc>
