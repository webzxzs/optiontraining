<title id="ttl">L11买股票、现金担保卖Put、备兑Call、裸卖Call与不交易的到期经济损益</title>
<desc id="dsc">统一虚构ABC现价100，45天期限，股票100股，卖K95 Put每股收入3、卖K110 Call每股收入2.5、备兑Call另外持有100股买价100；均按100股标准乘数、无费用/股息/利息。股价0至180展示五条到期盈亏线。现金担保Put最大赚300、最坏亏9200；备兑Call最大赚1250、最坏亏9750；裸Call最大赚250且理论股价无限上涨导致亏损没有上限。图右边股价180并不是裸Call风险的终点。没有期权成交报价与时间路径，不能当作实时收益。</desc>
