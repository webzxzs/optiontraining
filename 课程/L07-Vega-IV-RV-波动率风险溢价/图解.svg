<text x="72" y="440" font-size="18" font-weight="700" fill="#28435a">② 财报后按真实假设Ask回补卖跨式：IV下降也可能亏钱</text>
<text x="72" y="466" font-size="14" fill="#60798d">初始各卖1张100 Call和100 Put，Bid各$5.80，总收$1,160；下列是各自独立的虚构回补报价</text>
<line x1="88" y1="543" x2="969" y2="543" stroke="#899aa9" stroke-width="2"/>
<text x="78" y="548" text-anchor="end" font-size="14" fill="#758697">$0</text>
