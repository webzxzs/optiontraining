<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="820" viewBox="0 0 1060 820" role="img" aria-labelledby="title description">
<title id="title">L07 Vega随期限变化和卖财报跨式后的亏盈情景</title>
<desc id="description">上图是欧式BSM教学模型，S=K=100、sigma30%、r=q=0，Vega按每股每IV变动1个百分点计算，7天0.05524、30天0.11427、90天0.19755、180天0.27861。下图是独立虚构的财报后卖跨式按回补Ask计算的已实现损益情景，期初卖两腿收1160美元。股价100时回补Ask7，赚460；90时回补12，亏40；112时回补14，亏240；120时回补20.50，亏890。两图不是统一真实市场报价，也不是概率预测。</desc>
<rect width="1060" height="820" rx="16" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="44" font-size="28" font-weight="700" fill="#183447">Vega 的期限暴露与“卖高IV”实际风险</text>
<text x="48" y="78" font-size="15" fill="#596e82">两张图属于不同教学模型，不得拼成真实期权链或回测。</text>
<text x="72" y="105" font-size="18" font-weight="700" fill="#28435a">① BSM欧式平值期权：每股 Vega / 1个百分点IV变化</text>
