<text x="48" y="765" font-size="14" fill="#607488">卖方净结果 = ($11.60 − 财报后两腿合计回补Ask) × 100；未计手续费、保证金、提前指派。</text>
<text x="48" y="795" font-size="13" fill="#73869a">上图是局部敏感度、下图是虚构成交现金流；都不是概率、收益承诺或投资建议。</text>
