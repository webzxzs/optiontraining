<title id="ttl">L13四种跨式与宽跨式策略的到期损益对比</title>
<desc id="dsc">虚构ABC现价100，30天同到期标准100股美式期权。Long Straddle买C100 Ask8和P100 Ask7.5花1550美元，BE84.5与115.5；Short Straddle卖Bid7.5和6.6收1410美元，BE85.9与114.1。Long Strangle买P90 Ask3.5与C110 Ask4花750美元，BE82.5与117.5；Short Strangle卖P90 Bid3.2和C110 Bid3.7收690美元，BE83.1与116.9。图为40到160股票终价的到期美元利润，短仓向上理论亏损无上限，此坐标不是损失边界。未计费用和提前指派。</desc>
