<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="ttl desc">
<title id="ttl">L05：三张Call的Delta等效股数、固定股票空头及净Delta随股价变化</title>
<desc id="desc">教学假设：股票初始100美元，买3张Call，各100股乘数，初始Delta0.60，Gamma0.02每美元股价变动。配合卖空180股后初始Delta中性。股价98时Call等效168股、股票空头负180、净负12股，应买回12股；股价102时Call等效192股、空头负180、净正12股，应再卖空12股。Gamma仅局部线性演示，非实盘定价或总收益曲线。</desc>
<rect width="1080" height="750" rx="13" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="44" font-size="28" font-weight="700" fill="#172c3e">Delta 中性：只在这一瞬间中性</text>
<text x="48" y="75" font-size="16" fill="#597082">三张多头Call：Delta0.60、Gamma0.02/美元，初始空180股股票（全部为教学假设）</text>
<rect x="114" y="123" width="888" height="259" rx="7" fill="#f8fafc"/>
<line x1="120" x2="120" y1="130" y2="640" stroke="#e7eef5" stroke-width="1.5"/><text x="120" y="667" font-size="17" text-anchor="middle" fill="#465e70">96</text><line x1="339" x2="339" y1="130" y2="640" stroke="#e7eef5" stroke-width="1.5"/><text x="339" y="667" font-size="17" text-anchor="middle" fill="#465e70">98</text><line x1="558" x2="558" y1="130" y2="640" stroke="#c8d3de" stroke-width="1.5"/><text x="558" y="667" font-size="17" text-anchor="middle" fill="#465e70">100</text><line x1="777" x2="777" y1="130" y2="640" stroke="#e7eef5" stroke-width="1.5"/><text x="777" y="667" font-size="17" text-anchor="middle" fill="#465e70">102</text><line x1="996" x2="996" y1="130" y2="640" stroke="#e7eef5" stroke-width="1.5"/><text x="996" y="667" font-size="17" text-anchor="middle" fill="#465e70">104</text><line x1="120" x2="996" y1="354.5833333333333" y2="354.5833333333333" stroke="#e0e9f1"/><text x="107" y="360.5833333333333" text-anchor="end" font-size="15" fill="#5a6d7c">-200</text><line x1="120" x2="996" y1="303.54166666666663" y2="303.54166666666663" stroke="#e0e9f1"/><text x="107" y="309.54166666666663" text-anchor="end" font-size="15" fill="#5a6d7c">-100</text><line x1="120" x2="996" y1="252.5" y2="252.5" stroke="#e0e9f1"/><text x="107" y="258.5" text-anchor="end" font-size="15" fill="#5a6d7c">0</text><line x1="120" x2="996" y1="201.45833333333331" y2="201.45833333333331" stroke="#e0e9f1"/><text x="107" y="207.45833333333331" text-anchor="end" font-size="15" fill="#5a6d7c">100</text><line x1="120" x2="996" y1="150.41666666666669" y2="150.41666666666669" stroke="#e0e9f1"/><text x="107" y="156.41666666666669" text-anchor="end" font-size="15" fill="#5a6d7c">200</text>
<text x="120" y="104" font-size="18" font-weight="600" fill="#273f54">① 局部Delta等效股数</text>
