<line x1="120" x2="996" y1="627.5" y2="627.5" stroke="#e0e9f1" stroke-width="1"/><text x="107" y="633.5" text-anchor="end" font-size="15" fill="#5a6d7c">-24</text><line x1="120" x2="996" y1="590" y2="590" stroke="#e0e9f1" stroke-width="1"/><text x="107" y="596" text-anchor="end" font-size="15" fill="#5a6d7c">-12</text><line x1="120" x2="996" y1="552.5" y2="552.5" stroke="#7c8d9b" stroke-width="2"/><text x="107" y="558.5" text-anchor="end" font-size="15" fill="#5a6d7c">0</text><line x1="120" x2="996" y1="515" y2="515" stroke="#e0e9f1" stroke-width="1"/><text x="107" y="521" text-anchor="end" font-size="15" fill="#5a6d7c">12</text><line x1="120" x2="996" y1="477.5" y2="477.5" stroke="#e0e9f1" stroke-width="1"/><text x="107" y="483.5" text-anchor="end" font-size="15" fill="#5a6d7c">24</text>
<text x="120" y="435" font-size="18" font-weight="600" fill="#273f54">② 同一持仓的剩余净Delta：股价一变就偏离0</text>
<path d="M120.00,627.50 L174.75,618.13 L229.50,608.75 L284.25,599.38 L339.00,590.00 L393.75,580.63 L448.50,571.25 L503.25,561.88 L558.00,552.50 L612.75,543.13 L667.50,533.75 L722.25,524.38 L777.00,515.00 L831.75,505.63 L886.50,496.25 L941.25,486.88 L996.00,477.50" fill="none" stroke="#7351b1" stroke-width="4.5"/>
<circle cx="339" cy="590" r="6" fill="#7351b1" stroke="white" stroke-width="2"/><text x="347" y="579" font-size="15" fill="#55357c">净 -12股</text><circle cx="558" cy="552.5" r="6" fill="#7351b1" stroke="white" stroke-width="2"/><text x="566" y="541.5" font-size="15" fill="#55357c">净 0股</text><circle cx="777" cy="515" r="6" fill="#7351b1" stroke="white" stroke-width="2"/><text x="785" y="504" font-size="15" fill="#55357c">净 +12股</text>
<text x="558" y="698" text-anchor="middle" font-size="18" fill="#405c73">ABC 股价（美元）</text>
<text x="56" y="713" font-size="15" fill="#526879">股价98：买回12股才能重新中性；股价102：再卖空12股。全图不含Theta、IV、利息、指派与交易成本。</text>
<text x="56" y="737" font-size="13" fill="#6a7f90">注意：上图使用Γ常数的局部线性近似，不能向远离100的股价外推；它也不是到期P/L或实盘保证。</text>
</g></svg>