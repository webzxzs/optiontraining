<line x1="817.9" y1="215" x2="817.9" y2="859" stroke="#e9eff4"/><text x="817.9" y="888" text-anchor="middle" font-size="15" fill="#586f81">120</text>
<line x1="1075.0" y1="215" x2="1075.0" y2="859" stroke="#e9eff4"/><text x="1075.0" y="888" text-anchor="middle" font-size="15" fill="#586f81">140</text>
