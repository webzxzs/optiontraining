<text x="567.7" y="309.5" fill="#267e9d" font-size="14" font-weight="600">Cal +$100</text>
<text x="632.0" y="255.3" fill="#a363ba" font-size="14" font-weight="600">Diag +$250</text>
<text x="48" y="614" font-size="18" font-weight="600" fill="#263f56">二、远月C100在第30天仍有60天：其可卖Bid与内在价值（每股美元）</text>
<rect x="175" y="639" width="900" height="220" rx="5" fill="#fbfcfe"/>
<line x1="52" y1="647" x2="99" y2="647" stroke="#287f61" stroke-width="4"/><text x="111" y="653" font-size="16" fill="#31536d">远月长Call真实假设Bid（包含剩余时间价值）</text>
<line x1="644" y1="647" x2="691" y2="647" stroke="#c98434" stroke-width="3" stroke-dasharray="8 5"/><text x="703" y="653" font-size="16" fill="#31536d">K100近月Call到期内在价值</text>
<line x1="175" y1="859.0" x2="1075" y2="859.0" stroke="#e5edf4"/><text x="160" y="864.0" text-anchor="end" font-size="13" fill="#587184">0</text>
