<line x1="175" y1="761.2" x2="1075" y2="761.2" stroke="#e5edf4"/><text x="160" y="766.2" text-anchor="end" font-size="13" fill="#587184">20</text>
<line x1="175" y1="712.3" x2="1075" y2="712.3" stroke="#e5edf4"/><text x="160" y="717.3" text-anchor="end" font-size="13" fill="#587184">30</text>
<line x1="175" y1="663.4" x2="1075" y2="663.4" stroke="#e5edf4"/><text x="160" y="668.4" text-anchor="end" font-size="13" fill="#587184">40</text>
<path d="M175.0,858.3 L367.9,855.1 L496.4,843.8 L560.7,834.6 L625.0,819.4 L689.3,797.9 L817.9,751.4 L1075.0,654.6" stroke="#287f61" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M175.0,859.0 L367.9,859.0 L496.4,859.0 L560.7,859.0 L625.0,834.6 L689.3,810.1 L817.9,761.2 L1075.0,663.4" stroke="#c98434" stroke-width="3" fill="none" stroke-dasharray="8 5" stroke-linejoin="round"/>
<text x="625" y="920" text-anchor="middle" font-size="17" fill="#3f657b">ABC第30天股价（美元）；不是第90天股价</text>
<text x="48" y="955" font-size="14" fill="#547387">上图：Calendar=100×(远Call Bid−短C100内在−4.00)；Diagonal=100×(远Call Bid−短C105内在−5.60)。</text>
<text x="48" y="977" font-size="14" fill="#547387">这是第30天假设Bid与短腿经济支付的示意，不是长短腿在同一最终到期日的固定支付函数。</text>
<text x="48" y="999" font-size="13" fill="#647d91">IV和剩余时间价值变动会改变两条利润线；提前被指派、融资、股息、真实报价深度需单独审计。</text>
</g></svg>