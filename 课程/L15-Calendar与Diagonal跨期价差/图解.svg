<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" role="img" aria-labelledby="title desc">
<title id="title">L15近月到期时Calendar与Diagonal的现金损益及远月仍有60天的Call报价</title>
<desc id="desc">虚构ABC现价100，30天短腿到期、90天远腿到期；长90天C100买Ask7.30，Calendar卖30天C100 Bid3.30成本400美元，Diagonal卖30天C105 Bid1.70成本560美元。短腿在第30天按内在结清，长腿仍有60天期限以假设Bid卖出。图上半部八态股价70,85,95,100,105,110,120,140，对应Calendar净利润-385,-320,-90,100,-90,-150,-200,-220美元；Diagonal-545,-480,-250,-60,250,190,140,120美元。下半部Long Call卖出Bid0.15,0.8,3.1,5,8.1,12.5,22,41.8（每股）及近月K100内在价值0,0,0,0,5,10,20,40。此为短腿到期日虚构市场快照，不是两腿在90天同到期的曲线；剩余60天远月IV、Bid/Ask会改变利润，指派需单独结算。</desc>
<rect x="0" y="0" width="1240" height="1020" rx="18" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="49" y="48" font-size="28" font-weight="700" fill="#1c3c51">跨期价差：短腿第30天到期，长腿却仍有60天</text>
<text x="49" y="78" font-size="15" fill="#55778b">教学ABC股价$100 · 标准100股/张 · 远C100/T90买Ask7.30 · 近C100/T30卖Bid3.30 或 C105/T30卖Bid1.70</text>
<text x="48" y="120" font-size="18" font-weight="600" fill="#263f56">一、短腿到期当天两腿经济结清的每组美元P/L</text>
