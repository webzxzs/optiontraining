<text x="55" y="753" font-size="14" fill="#566d83">这些曲线只在固定S=K和IV的模型中成立，非任意深虚值/实值期权的定律。</text>
<text x="55" y="777" font-size="14" fill="#566d83">注意：Theta是即时偏导；最后1天不可将该偏导乘1当成完整到期损失，且真实交易还要考虑Bid/Ask及行权。</text>
