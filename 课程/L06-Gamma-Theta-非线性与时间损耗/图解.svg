<title id="ttl">L06 Gamma与Theta的ATM剩余到期天数对比，BSM教学模型</title>
<desc id="desc">虚构欧式无股息Black-Scholes-Merton模型，S=K=100美元，波动率年化30%，无风险利率0，剩余T=d/365年。上图Gamma随到期天数减少而增大：30天0.04634、7天0.09600、1天0.25405。下图每天Theta绝对值同样增加：30天0.05713、7天0.11836、1天0.31321美元/股/日。全图为模型偏导，不是可交易报价或实际每日损益。</desc>
<rect width="1080" height="800" rx="18" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="55" y="43" font-size="27" font-weight="700" fill="#1a3046">ATM Gamma 与 Theta：越靠近到期，局部变化越剧烈</text>
<text x="55" y="76" font-size="16" fill="#536a7e">BSM欧式教学：S=K=$100 · 年化IV=30% · r=q=0 · T=d/365。不是美式实盘Greeks或P/L。</text>
