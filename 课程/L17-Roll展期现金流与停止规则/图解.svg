<title id="ttl">L17 Roll up and out：历史期权现金流桥接与同一期限的三种决策收益</title>
<desc id="dsc">虚构ABC股票原100美元买100股，卖C105获300美元。20天后股票涨到110，按Ask7.4回补旧C105支出740美元，卖新60天C115按Bid4.8得480美元。Roll时点两笔订单净借记260美元，累计期权现金40美元，旧腿已实现亏440美元，新Call仍未结清负债。下图横坐标新C115到期股价70到140；三策略从原始t0起完整利润：tR清仓为恒560美元；tR旧Call买回但只持股票的收益100乘S减104.4；tR旧Call买回且卖新C115的收益100乘min(S,115)减99.6。到期T股价70、90、105、115、140时Roll总利润为-2960,-960,540,1540,1540美元。请勿把滚动信用收入当净利润，此图为虚构到期经济终价并不表示期中可平仓Bid/Ask、提前指派和资金路径。</desc>
<rect width="1280" height="1140" rx="20" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="50" y="48" font-size="28" font-weight="700" fill="#1d3b52">Roll展期不是回本：先确认旧仓损失，再评价新交易</text>
<text x="50" y="79" font-size="16" fill="#647c8e">ABC原买价$100、100股 · 旧C105卖开$3 · 第20天股票$110、旧Call买回Ask$7.40 · 新C115卖开Bid$4.80</text>
<text x="55" y="125" font-size="19" font-weight="700" fill="#264a62">一、期权买卖现金桥接（美元）——忽略佣金与融资</text>
<rect x="165" y="151" width="945" height="225" rx="7" fill="#fafcfe"/>
<line x1="165" x2="1110" y1="260" y2="260" stroke="#91a4ae" stroke-width="2"/>
<rect x="248" y="227" width="95" height="33" rx="5" fill="#218b72"/><text x="295.5" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#218b72">+$300</text><text x="295.5" y="401" text-anchor="middle" font-size="16" fill="#536d7d">t0 卖旧C105</text>
<rect x="573" y="260" width="95" height="81.4" rx="5" fill="#c26c54"/><text x="620.5" y="368" text-anchor="middle" font-size="19" font-weight="700" fill="#c26c54">−$740</text><text x="620.5" y="401" text-anchor="middle" font-size="16" fill="#536d7d">tR 买回旧C105</text>
<rect x="898" y="207.2" width="95" height="52.8" rx="5" fill="#218b72"/><text x="945.5" y="195.2" text-anchor="middle" font-size="19" font-weight="700" fill="#218b72">+$480</text><text x="945.5" y="401" text-anchor="middle" font-size="16" fill="#536d7d">tR 卖新C115</text>
<text x="53" y="431" font-size="16" fill="#436276">旧Call已实现：+$300−$740=−$440；本次Roll净现金：−$740+$480=−$260。</text>
<text x="53" y="456" font-size="16" font-weight="700" fill="#9b5c46">历史期权现金净额：+$40，但新C115尚有负债——+$40不等于已实现利润。</text>
<text x="55" y="488" font-size="19" font-weight="700" fill="#264a62">二、共同新到期日T的总经济P/L（包含旧Call损失和原100股）</text>
<line x1="55" x2="91" y1="501" y2="501" stroke="#7f8996" stroke-width="4" stroke-dasharray="9 7"/><text x="98" y="506" font-size="16" fill="#395c71">tR退出：现金 +$560</text>
<line x1="460" x2="496" y1="501" y2="501" stroke="#287fa8" stroke-width="4" /><text x="503" y="506" font-size="16" fill="#395c71">tR回补旧Call，仅持股</text>
<line x1="920" x2="956" y1="501" y2="501" stroke="#388c73" stroke-width="4" /><text x="963" y="506" font-size="15" fill="#395c71">tR回补旧Call并卖新C115</text>
