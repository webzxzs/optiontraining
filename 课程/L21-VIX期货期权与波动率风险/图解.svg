<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1420" viewBox="0 0 1300 1420" role="img" aria-labelledby="ttl dsc">
<title id="ttl">L21 VIX现货、VX期货、VIX指数期权和VX期货期权的交割、价格与现金支付比较</title>
<desc id="dsc">上部四种产品的实际交割类别：VIX是指标不能直接持有，CFE标准VX期货1000美元每点，VIX指数欧式期权100美元每点且SOQ VRO现金结算，VX期货期权行权交割为期货并需要保证金。中部虚构两个时点VIX spot18变25，但VX近月先按Ask21.2买入、后按Bid20.3卖出一张期货亏900美元，次月22.7变22.2亏500美元；走势不一样。下部同一VIX指数期权VRO结算值15到40，买K20 Call开仓Ask2.4每点乘数100与K20/K25牛市价差净Debit1.5每点的到期经济损益，分别BE22.4和21.5；价差最高利润350美元。所有行情均为教学虚构，不是实际买卖报价，期权到期日与期货中途时点不同，不能把两个图合并构造无风险交易。</desc>
<rect width="1300" height="1420" rx="22" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="49" y="50" font-size="28" font-weight="700" fill="#213e55">L21｜VIX波动率不是一支股票：三张不同时间与结算的账</text>
<text x="49" y="78" font-size="15" fill="#607c8c">模拟教材，不是实时行情。产品代码、行权风格、乘数、结算值与交易时点必须逐项核对。</text>
<text x="48" y="121" font-size="20" font-weight="700" fill="#31536b">一、看似相同的“VIX”名称，其实有四层合同</text>
<rect x="39" y="129" width="1221" height="266" rx="13" fill="#f6f9fc"/>
<rect x="50" y="146" width="578" height="98" rx="12" fill="#ffffff" stroke="#708296" stroke-width="2"/>
<rect x="51" y="147" width="8" height="96" rx="3" fill="#708296"/>
<text x="73" y="175" font-size="19" font-weight="700" fill="#708296">VIX Spot</text>
<text x="73" y="201" font-size="16" fill="#49657a">指标，不能直接买一股</text>
<text x="73" y="226" font-size="14" fill="#697f8d">SPX期权隐含30天年化波动</text>
<rect x="660" y="146" width="578" height="98" rx="12" fill="#ffffff" stroke="#ac7245" stroke-width="2"/>
<rect x="661" y="147" width="8" height="96" rx="3" fill="#ac7245"/>
<text x="683" y="175" font-size="19" font-weight="700" fill="#ac7245">VX 期货</text>
<text x="683" y="201" font-size="16" fill="#49657a">结算SOQ；每点 × $1,000</text>
<text x="683" y="226" font-size="14" fill="#697f8d">期中逐日盯市 / 维持保证金</text>
<rect x="50" y="266" width="578" height="98" rx="12" fill="#ffffff" stroke="#227f9b" stroke-width="2"/>
<rect x="51" y="267" width="8" height="96" rx="3" fill="#227f9b"/>
<text x="73" y="295" font-size="19" font-weight="700" fill="#227f9b">VIX/VIXW 期权</text>
<text x="73" y="321" font-size="16" fill="#49657a">欧式，现金结算；× $100</text>
<text x="73" y="346" font-size="14" fill="#697f8d">到期以相关SOQ结算值VRO算</text>
<rect x="660" y="266" width="578" height="98" rx="12" fill="#ffffff" stroke="#7a66a1" stroke-width="2"/>
<rect x="661" y="267" width="8" height="96" rx="3" fill="#7a66a1"/>
<text x="683" y="295" font-size="19" font-weight="700" fill="#7a66a1">VX 期货期权</text>
<text x="683" y="321" font-size="16" fill="#49657a">欧式，行权成交VX期货</text>
<text x="683" y="346" font-size="14" fill="#697f8d">之后继续有期货保证金义务</text>
<text x="49" y="430" font-size="20" font-weight="700" fill="#31536b">二、同一个t0→t1：现货VIX向上，近月和远月期货反而下跌</text>
