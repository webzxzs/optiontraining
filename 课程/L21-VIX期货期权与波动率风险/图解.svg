<text x="50" y="885" font-size="16" font-weight="600" fill="#ad613c">近月标准VX： (20.30 − 21.20) × $1,000 = −$900；VIX现货此时却由18涨至25。</text>
<text x="50" y="919" font-size="20" font-weight="700" fill="#31536b">三、同一结算VRO的VIX指数期权现金P/L（不是盘中Spot VIX）</text>
