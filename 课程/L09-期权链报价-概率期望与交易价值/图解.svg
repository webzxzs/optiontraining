<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">L09 同一虚构股票五种选择的到期损益与主观期望值</title>
<desc id="desc">虚构ABC股价初始100美元，五种策略是100股正股、Call K100买价5.20、Put K95卖价2.00、Bull Call Spread K100买价5.20和K110卖价1.50、不交易。终价70、90、100、105、110、120及主观概率5%、15%、30%、20%、20%、10%；各策略主观期望分别为正股200美元、买Call负20美元、短Put0美元、Bull Call Spread正30美元和不交易0美元。图表比较美元到期利润，不同策略投资资本与最大亏损完全不同；主观概率不是历史结果或市场风险中性概率。</desc>
<rect width="1200" height="900" rx="16" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="48" font-size="29" font-weight="700" fill="#173244">同一只股票，同一到期日：五种选择的经济现金流</text>
<text x="48" y="80" font-size="16" fill="#647b8e">ABC现价$100，所有报价、概率均为教学假设；每份期权乘数100股，忽略费用、融资与股息</text>
<text x="48" y="115" font-size="21" font-weight="700" fill="#294658">① 不同终价时的到期净利润（美元，不是实时平仓价）</text>
<text x="90" y="166" font-size="16" fill="#243f53">终价(概率)</text>
<text x="270" y="166" text-anchor="end" font-size="16" font-weight="700" fill="#243f53">100股正股</text><text x="475" y="166" text-anchor="end" font-size="16" font-weight="700" fill="#243f53">买K100 Call</text><text x="680" y="166" text-anchor="end" font-size="16" font-weight="700" fill="#243f53">卖K95 Put</text><text x="885" y="166" text-anchor="end" font-size="16" font-weight="700" fill="#243f53">Bull Call Spread</text><text x="1090" y="166" text-anchor="end" font-size="16" font-weight="700" fill="#243f53">不交易</text>
<rect x="51" y="186" width="1097" height="42" fill="#f5f8fc"/><text x="90" y="214" font-size="18" fill="#344d61">70 (5%)</text><text x="270" y="214" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$3,000</text><text x="475" y="214" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$520</text><text x="680" y="214" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$2,300</text><text x="885" y="214" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$370</text><text x="1090" y="214" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text><rect x="51" y="229" width="1097" height="42" fill="#ffffff"/><text x="90" y="257" font-size="18" fill="#344d61">90 (15%)</text><text x="270" y="257" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$1,000</text><text x="475" y="257" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$520</text><text x="680" y="257" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$300</text><text x="885" y="257" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$370</text><text x="1090" y="257" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text><rect x="51" y="272" width="1097" height="42" fill="#f5f8fc"/><text x="90" y="300" font-size="18" fill="#344d61">100 (30%)</text><text x="270" y="300" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text><text x="475" y="300" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$520</text><text x="680" y="300" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$200</text><text x="885" y="300" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$370</text><text x="1090" y="300" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text><rect x="51" y="315" width="1097" height="42" fill="#ffffff"/><text x="90" y="343" font-size="18" fill="#344d61">105 (20%)</text><text x="270" y="343" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$500</text><text x="475" y="343" text-anchor="end" font-size="18" font-weight="600" fill="#b25c46">−$20</text><text x="680" y="343" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$200</text><text x="885" y="343" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$130</text><text x="1090" y="343" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text><rect x="51" y="358" width="1097" height="42" fill="#f5f8fc"/><text x="90" y="386" font-size="18" fill="#344d61">110 (20%)</text><text x="270" y="386" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$1,000</text><text x="475" y="386" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$480</text><text x="680" y="386" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$200</text><text x="885" y="386" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$630</text><text x="1090" y="386" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text><rect x="51" y="401" width="1097" height="42" fill="#ffffff"/><text x="90" y="429" font-size="18" fill="#344d61">120 (10%)</text><text x="270" y="429" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$2,000</text><text x="475" y="429" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$1,480</text><text x="680" y="429" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$200</text><text x="885" y="429" text-anchor="end" font-size="18" font-weight="600" fill="#177b69">+$630</text><text x="1090" y="429" text-anchor="end" font-size="18" font-weight="600" fill="#506779">$0</text>
<text x="53" y="498" font-size="15" fill="#5d7181">注意：Call可全损$520，Spread可损$370，短Put极端亏损达$9,300，正股100股可亏$10,000。</text>
<line x1="48" y1="526" x2="1150" y2="526" stroke="#dde7f0"/>
<text x="48" y="563" font-size="21" font-weight="700" fill="#294658">② 按上表“主观概率”算出的期望美元净收益</text>
<text x="48" y="588" font-size="15" fill="#60798a">概率并非市场隐含概率；不同最大损失和资金占用，不可只按下方柱高选交易</text>
<rect x="64" y="606" width="1073" height="133" rx="9" fill="#f7fafc"/>
<line x1="85" y1="677" x2="1125" y2="677" stroke="#778f9f" stroke-width="2"/>
<rect x="135" y="613" width="80" height="64" rx="4" fill="#2b8d80"/><text x="175" y="600" font-size="18" font-weight="700" fill="#197866" text-anchor="middle">+$200</text><text x="175" y="741" font-size="15" fill="#3f576c" text-anchor="middle">100股</text>
<rect x="353" y="677" width="80" height="6.4" rx="4" fill="#be7760"/><text x="393" y="702" font-size="18" font-weight="700" fill="#a2543b" text-anchor="middle">−$20</text><text x="393" y="741" font-size="15" fill="#3f576c" text-anchor="middle">长Call</text>
<rect x="571" y="677" width="80" height="2" rx="4" fill="#8d9caf"/><text x="611" y="702" font-size="18" font-weight="700" fill="#566a7c" text-anchor="middle">$0</text><text x="611" y="741" font-size="15" fill="#3f576c" text-anchor="middle">短Put</text>
<rect x="789" y="667.4" width="80" height="9.6" rx="4" fill="#2b8d80"/><text x="829" y="654.4" font-size="18" font-weight="700" fill="#197866" text-anchor="middle">+$30</text><text x="829" y="741" font-size="15" fill="#3f576c" text-anchor="middle">Bull Spread</text>
<rect x="1007" y="677" width="80" height="2" rx="4" fill="#8d9caf"/><text x="1047" y="702" font-size="18" font-weight="700" fill="#566a7c" text-anchor="middle">$0</text><text x="1047" y="741" font-size="15" fill="#3f576c" text-anchor="middle">不交易</text>
<text x="48" y="791" font-size="16" font-weight="700" fill="#3c566a">结论：一个“正期望”数字只有在概率可信、能真实成交、账户能承受尾部损失时才有决策价值。</text>
<text x="48" y="827" font-size="14" fill="#5a7589">两腿价差开仓按买腿Ask、卖腿Bid；到期损益不等于盘中平仓价或实际账户保证金风险。</text>
<text x="48" y="854" font-size="14" fill="#5a7589">图中期望：股票+$200；Call−$20；短Put$0；Bull Spread+$30；不交易$0，仅适用于这组六态概率。</text>
</g></svg>