<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="830" viewBox="0 0 1110 830" role="img" aria-labelledby="ttl desc">
<title id="ttl">L04 四种基础期权头寸的独立到期净损益曲线</title>
<desc id="desc">虚构ABC现价100美元。图分四格：买105Call权利金4，买95Put权利金3，裸卖110Call收2，卖90Put收2。标准一张100股，横轴到期股价0到160，纵轴每张美元到期净损益。四图纵轴刻度彼此不同，不能仅凭曲线高度判断谁赚更多。忽略费用与提前指派。</desc>
<rect width="1110" height="830" fill="#fff"/>
<text x="39" y="38" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1e3448">四种头寸：收益结构不对称</text>
<text x="40" y="66" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5d7185">虚构ABC｜标准合约100股/张｜忽略费用、融资、分红、提前指派｜各格纵轴范围不同</text>
