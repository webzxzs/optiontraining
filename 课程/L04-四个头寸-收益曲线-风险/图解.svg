<text x="40" y="789" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#526579">读图：横轴是到期股票价格；纵轴是期权腿到期净损益。到期前价格变化与履约资金需求不能从本图推断。</text>
<text x="40" y="814" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#7b8996">教学图示：不同K与权利金是独立假设，不代表同一真实市场盘口或可套利组合。</text>
