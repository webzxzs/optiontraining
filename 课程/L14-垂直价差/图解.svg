<title id="title">L14四种垂直价差同终点收益：看涨/看跌信用与借记的支付曲线</title>
<desc id="desc">虚构股票ABC现价100、60天到期、K95和K105、100股乘数。Bull Call买C95 Ask9.50卖C105 Bid4.10花540；Bull Put卖P105 Bid9.10买P95 Ask4.50收460；二者同终点收益形状重合，低于95损失540，105及以上获利460，盈亏平衡100.4。Bear Put买P105 Ask9.50卖P95 Bid4.10花540；Bear Call卖C95 Bid9.10买C105 Ask4.50收460；二者到期重合，95及以下获利460，105及以上损失540，盈亏平衡99.6。实线与虚线是重叠曲线的两种交易方式。数据只是到期净经济支付，不是盘中成交价，早指派可形成100股临时敞口。</desc>
