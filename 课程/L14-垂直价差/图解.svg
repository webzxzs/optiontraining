<text x="620" y="680" font-size="17" text-anchor="middle" fill="#385b71">60天到期时ABC股价（美元/股）</text>
<text x="52" y="723" font-size="15" fill="#4e7084">看涨价差（两线重叠）：低端−$540、高端+$460，BE=$100.40。</text>
<text x="52" y="749" font-size="15" fill="#4e7084">看跌价差（两线重叠）：低端+$460、高端−$540，BE=$99.60。</text>
<text x="52" y="780" font-size="14" font-weight="700" fill="#ad6545">限定的只是同交割物且双腿完整到期时的经济损失；短腿提前指派可能需要买卖100股并增加现金与融资风险。</text>
<text x="52" y="804" font-size="14" fill="#647c8e">借记实线与信用虚线拥有相同到期净值，但期初现金流、利息/股息/手续费、指派与券商保证金路径并不相同。</text>
<text x="52" y="825" font-size="13" fill="#6d8190">本图不是市场真实报价，不能据此推断无风险套利或任意时间的实际平仓价格。</text>
