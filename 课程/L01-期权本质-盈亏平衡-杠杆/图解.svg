  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="108" y="593" rx="11" width="816" height="64" fill="#f0f4f9"/>
    <rect x="120" y="608" width="22" height="5" rx="2" fill="#2c73ad"/>
    <text x="149" y="618" font-size="14" fill="#22374d">100股正股</text>
    <text x="150" y="639" font-size="17" font-weight="700" fill="#2c73ad">ST=108: +$800</text>
    <rect x="378" y="608" width="22" height="5" rx="2" fill="#1f977a"/>
    <text x="408" y="618" font-size="14" fill="#22374d">买105 Call</text>
    <text x="409" y="639" font-size="17" font-weight="700" fill="#1f977a">ST=108: −$100</text>
    <rect x="658" y="608" width="22" height="5" rx="2" fill="#cb6a37"/>
    <text x="687" y="618" font-size="14" fill="#22374d">卖95 Put</text>
    <text x="688" y="639" font-size="17" font-weight="700" fill="#cb6a37">ST=108: +$300</text>
    <text x="115" y="575" font-size="13" fill="#667686">到期经济损益；未含费用、融资、股息、提前指派。曲线未按风险预算/Delta/资金占用等效。</text>
  </g>
