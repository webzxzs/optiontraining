<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="ttl desc">
  <title id="ttl">ABC：持有100股、买105 Call、卖95 Put的到期净收益比较</title>
  <desc id="desc">假设ABC现价100，合约乘数100，Call行权价105买价4，卖出Put行权价95收款3。横轴到期股价60至150，纵轴美元盈亏。到期108时，持有100股盈利800，买Call亏100，卖Put盈利300。无交易费与提前指派，三者资金占用不同。</desc>
  <rect x="0" y="0" width="1000" height="680" rx="14" fill="#fff"/>
  <text x="48" y="30" fill="#152b3f" font-size="24" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">同一标的，不同权利与义务</text>
  <rect x="108" y="56" width="816" height="467" fill="#fbfcfe" stroke="#d9e2eb"/>
