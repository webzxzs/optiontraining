-width="1"/><text x="94" y="505.76" font-size="14" fill="#596b79" text-anchor="end">-4,000</text><line x1="108" x2="924" y1="411.81" y2="411.81" stroke="#e9eef4" stroke-width="1"/><text x="94" y="416.81" font-size="14" fill="#596b79" text-anchor="end">-2,000</text><line x1="108" x2="924" y1="322.86" y2="322.86" stroke="#667b8e" stroke-width="2"/><text x="94" y="327.86" font-size="14" fill="#596b79" text-anchor="end">0</text><line x1="108" x2="924" y1="233.90" y2="233.90" stroke="#e9eef4" stroke-width="1"/><text x="94" y="238.90" font-size="14" fill="#596b79" text-anchor="end">2,000</text><line x1="108" x2="924" y1="144.95" y2="144.95" stroke="#e9eef4" stroke-width="1"/><text x="94" y="149.95" font-size="14" fill="#596b79" text-anchor="end">4,000</text><line x1="108" x2="924" y1="56.00" y2="56.00" stroke="#e9eef4" stroke-width="1"/><text x="94" y="61.00" font-size="14" fill="#596b79" text-anchor="end">6,000</text></g>
