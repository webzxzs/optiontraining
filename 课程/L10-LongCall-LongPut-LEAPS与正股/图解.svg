<text x="52" y="811" font-size="14" fill="#607588">一张Call可全损权利金；股票持仓会更深地承担下跌；Put是看空保险，向上行情可能全损。</text>
<text x="52" y="831" font-size="13" fill="#607588">曲线是合同到期经济支付函数，非当前期权价格；真实Bid/Ask、IV、Theta、提前行权/交割和账户费用应另算。</text>
