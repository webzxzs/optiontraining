<title id="title">L10 正股与18个月三种Long Call和Long Put的到期经济损益</title>
<desc id="desc">虚构ABC现价100美元。正股100股买价100；18个月Call K90买价19、Call K100买价14、Call K110买价10、Put K100买价12，各张乘数100；忽略股息和费用。图为到期股票从40到160时的美元净收益。股票在终价110赚1000，C90赚100，C100亏400，C110亏1000，Put亏1200。期初支付资本、Delta方向暴露和损失范围各异，因此不可按曲线某点直接排名。非实时市场曲线。</desc>
