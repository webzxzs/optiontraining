<title id="title">L16 Short与Long Iron Condor、裸卖宽跨式的到期净损益与保护翼效果</title>
<desc id="desc">统一虚构股票ABC现价100、所有美式标准股票期权45天同到期、每腿100股。卖出型Iron Condor短P90长P80短C110长C120净收4.1/股，最大盈利410美元，最大亏损590美元，盈亏平衡85.9与114.1。反向Long Iron Condor买近腿卖外腿净付5.1/股，最大亏510美元最大盈利490美元。裸卖Strangle短P90与C110净收6.2/股，股票两端超出报价范围会产生极端亏损，向上涨理论亏损无上限。图左到右S=60到140，折线是到期理想合同净经济支付，不代表真实中途报价、账户保证金或被指派后股仓风险。</desc>
